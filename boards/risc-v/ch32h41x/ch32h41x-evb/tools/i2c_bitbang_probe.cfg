targets wch_riscv.cpu.0
halt
# PB6/7 GPIO-OD 输出模式
mww 0x40010c00 0x66444883
# 空闲: SCL=1 SDA=1
mww 0x40010c0c 0xc7
# START: SDA低 (SCL保持高)
mww 0x40010c0c 0x87
# SCL低
mww 0x40010c0c 0x83
# 字节 0xEE = 11101110, MSB first, 每位: 设SDA, SCL高, SCL低
# bit7=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit6=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit5=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit4=0
mww 0x40010c0c 0x83
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit3=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit2=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit1=1
mww 0x40010c0c 0xc7
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# bit0=0
mww 0x40010c0c 0x83
mww 0x40010c0c 0xd7
mww 0x40010c0c 0x87
# ACK: 释放SDA, SCL高, 读INDR
mww 0x40010c0c 0xc7
mdw 0x40010c08
mww 0x40010c0c 0x87
# STOP: SCL低, SDA低, SCL高, SDA高
mww 0x40010c0c 0x83
mww 0x40010c0c 0xc3
mww 0x40010c0c 0xd7
mww 0x40010c0c 0xc7


resume
exit
